name: Frontend checks

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [master, dev]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  checks:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.node-version'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # The house Web UI Standard: no Bootstrap or Tailwind, no inline styles,
      # every class resolves, and the stack matches the shared stack.json.
      - name: Check styles
        run: npm run lint:styles

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
