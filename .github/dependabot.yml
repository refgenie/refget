version: 2

# One bundled PR per month covering every package type.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: "monthly"
    target-branch: "dev"

updates:
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 6.1+ yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
